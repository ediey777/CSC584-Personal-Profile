
<!DOCTYPE html>
<html>
<head>
    <title>My Personal Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Personal Profile</h1>
        <p>Welcome to My Personal Profile Application</p>
    </div>

    <div class="form-card">
        <h2>Student Information</h2>
        <p class="subtitle">Please complete your personal details below.</p>

        <form action="ProfileServlet" method="POST">

            <label>Full Name</label>
            <input type="text" name="name"
                   value="Masrur Juwaidi Bin Ahmad" required>

            <label>Student ID</label>
            <input type="text" name="studentId"
                   value="2025575281" required>

            <label>Programme</label>
            <input type="text" name="program"
                   value="CSC548" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   value="edieyahmad97@gmail.com" required>

            <label>Hobbies</label>
            <input type="text" name="hobbies"
                   value="Repairing Electronic Board" required>

            <label>Short Self Introduction</label>
            <textarea name="introduction" rows="4"
                placeholder="Write something about yourself..."
                required></textarea>

            <button type="submit">Submit Profile</button>
        </form>
    </div>

    <footer>
        CSC584 Individual Assignment 1 | 2026
    </footer>
</div>

</body>
</html>
